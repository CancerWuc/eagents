name: eagents-github
services:
  mysql-github:
    container_name: eagents-github-mysql
    image: eagents-github-mysql:8.0
    build:
      context: ./backend
      dockerfile_inline: |
        FROM mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: eagent_github
      MYSQL_USER: eagent_github
      MYSQL_PASSWORD: ${EAGENT_DB_PASSWORD:?Set EAGENT_DB_PASSWORD}
    volumes:
      - mysql-data-github:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend-github:
    container_name: eagents-github-backend
    image: eagents-github-backend:local
    build: ./backend
    env_file: ./backend/.env.local
    environment:
      EAGENT_DB_HOST: mysql-github
      EAGENT_DB_PORT: "3306"
      EAGENT_DB_USER: eagent_github
      EAGENT_DB_NAME: eagent_github
      EAGENT_AUTH_MODE: strict
      EAGENT_PERF_WORKER_EMBEDDED: "1"
    ports:
      - "127.0.0.1:${EAGENT_BACKEND_PORT:-8189}:8080"
    volumes:
      - kb-data-github:/app/kb_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      mysql-github:
        condition: service_healthy
  frontend-github:
    container_name: eagents-github-frontend
    image: eagents-github-frontend:local
    build: ./frontend
    environment:
      EAGENT_BACKEND_UPSTREAM: backend-github:8080
    ports:
      - "127.0.0.1:${EAGENT_FRONTEND_PORT:-5174}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      backend-github:
        condition: service_healthy
volumes:
  mysql-data-github:
    name: eagents-github-mysql-data
  kb-data-github:
    name: eagents-github-kb-data
networks:
  default:
    name: eagents-github-network
