openapi: 3.1.0
info:
  title: eAgent 管理面 REST API
  version: "1.0.0"
  description: |
    管理台 REST（/api/v1/*）契约 v1（from_nekiro/01-contract-first.md P0-1）。

    - 身份：请求头 `cap-user-name`（工号）；strict 模式另需 `X-Admin-Token`。
    - 错误响应统一符合 Platform Error v1：`{code, message, traceId}`，
      code 取值见 from_nekiro/07-fail-closed-errors.md 错误码表。
    - 响应头 `X-Trace-Id` 为本次请求的 trace 标识（P0-3/P0-4 的血缘锚点）。
servers:
  - url: /
security:
  - capUser: []
  - adminToken: []
tags:
  - name: services
    description: A2A 服务注册（能力②）
  - name: agents
    description: Agent Team 目录/注册（能力③，原「总控 Agent」更名，内部标识 COMPOSITE 不变）
  - name: standalone
    description: 独立部署导出（standalone-deployment；card + KB 快照 + deploy_digest 三件套）
  - name: permissions
    description: 权限与可见性（§6）
  - name: releases
    description: 不可变 Release 与状态流转（P0-2）
  - name: installations
    description: 工作空间安装（P0-2）
  - name: instances
    description: 实例注册/心跳/租约（P1-2）
  - name: traces
    description: 调用血缘查询（P0-4）
  - name: perf
    description: 性能测试：数据集/压力/仿真（perf-test 01）
  - name: gateway
    description: Higress 网关配置控制面：profile/MCP 服务/路由/consumer/审计（higress-mcp-gateway，scope gateway:manage）
  - name: eval
    description: 评测集 / 人工标注 / 提示词优化闭环（能力④ Loop Engineer，local-debug/07）

paths:
  /api/v1/services:
    get:
      tags: [services]
      operationId: listServices
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [admin] }
          description: 传 admin 取全集（治理面）；默认按用户可见集合过滤
      responses:
        "200":
          description: 服务列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceRegistration" }
        "401": { $ref: "#/components/responses/PlatformError" }
    post:
      tags: [services]
      operationId: registerService
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterServiceRequest" }
      responses:
        "200":
          description: 注册成功（含兼容性判定）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRegistration" }
        "400": { $ref: "#/components/responses/PlatformError" }
        "401": { $ref: "#/components/responses/PlatformError" }
        "409": { $ref: "#/components/responses/PlatformError" }
        "502": { $ref: "#/components/responses/PlatformError" }
  /api/v1/services:probe:
    post:
      tags: [services]
      operationId: probeService
      description: 连接探测——拉取 Agent Card + 契约校验 + 兼容性判定，不落库；注册弹窗「测试连接」预览远端卡片用
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProbeServiceRequest" }
      responses:
        "200":
          description: 探测成功（卡片摘要 + 兼容性）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeServiceResult" }
        "400": { $ref: "#/components/responses/PlatformError" }
        "401": { $ref: "#/components/responses/PlatformError" }
        "502": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}:
    get:
      tags: [services]
      operationId: getService
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: 服务详情（含当前 Card 快照与健康观测）
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }
    patch:
      tags: [services]
      operationId: updateService
      description: |
        按来源更新注册配置。A2A_REMOTE 支持 displayName/tags/agentCardUrl/authSecretRef；
        HIAGENT 支持 displayName/description/baseUrl/appKey/skills/inputsSchema/connectionTest。
        slug 和来源不可变，错误来源字段返回400。密钥缺省或AppKey留空保留原值；
        clearCredential=true显式清除密钥（HIAGENT改用全局默认），不可同时填写新密钥。
        HIAGENT保存前验证参数与blocking/streaming连通性，失败保留原配置，成功刷新名片。
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: string }
                tags: { type: string }
                agentCardUrl: { type: string }
                authSecretRef: { type: object, additionalProperties: { type: string }, writeOnly: true }
                description: { type: string }
                baseUrl: { type: string, description: HIAGENT实例地址，空值改用全局默认 }
                appKey: { type: string, writeOnly: true, description: 留空保留原实例凭证 }
                skills: { type: array, items: { type: object } }
                inputsSchema: { type: object }
                connectionTest: { type: object }
                clearCredential: { type: boolean, default: false }
      responses:
        "200":
          description: 更新后的服务记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRegistration" }
        "400": { $ref: "#/components/responses/PlatformError" }
        "401": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }
        "502": { $ref: "#/components/responses/PlatformError" }
    delete:
      tags: [services]
      operationId: deleteService
      description: 级联删除已注册服务（带 Slug 强防呆 + 策略拦截 + 总控解绑与运行时 remount）；HIAGENT 来源额外清理 side 表/会话映射/合成 Card Revision 并摘除 /a2a/{slug} 端点。A2A 与 HIAGENT 来源均可删除，不可恢复。confirm 参数必须为 slug
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - name: confirm
          in: query
          required: true
          schema: { type: string }
          description: 必须与待删除服务的 slug 完全一致
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 是否强制解除总控绑定（A2A 来源适用）
      responses:
        "200":
          description: 删除结果（A2A：deleted/slug/cascade/remounted_masters；HIAGENT：含 endpoint_unmounted）
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
                  slug: { type: string }
                  cascade: { type: object }
                  remounted_masters: { type: array, items: { type: string } }
                  endpoint_unmounted: { type: boolean }
        "400": { $ref: "#/components/responses/PlatformError" }
        "401": { $ref: "#/components/responses/PlatformError" }
        "403": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }
        "409": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}:refresh:
    post:
      tags: [services]
      operationId: refreshService
      description: 重新拉取 Agent Card 并按 agent-card.v0.2 契约校验（fail-closed）
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: 刷新后的服务记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRegistration" }
        "400": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }
        "502": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}:enable:
    post:
      tags: [services]
      operationId: enableService
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: 启用后的服务记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRegistration" }
        "401": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}:disable:
    post:
      tags: [services]
      operationId: disableService
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: 禁用后的服务记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRegistration" }
        "401": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}/credentials:
    put:
      tags: [services]
      operationId: updateServiceCredentials
      description: |
        更新服务级出站凭证 headers（intranet-a2a-stream-adapter）。
        值 AES-GCM 加密落库（EAGENT_GATEWAY_MASTER_KEY），出站调用注入
        （如内网对端的 apikey 头）；headers=null 表示清除；响应不回显密文。
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateServiceCredentialsRequest" }
      responses:
        "200":
          description: 更新后的服务记录（凭证只回显是否已配置）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRegistration" }
        "400": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}/configuration:
    get:
      tags: [services]
      operationId: getServiceConfiguration
      description: 管理表单回填配置，按sourceType返回对应注册字段；credentialConfigured仅标识实例凭证是否存在，凭证明文和密文均不回显。
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: 注册配置（A2A_REMOTE或HIAGENT，字段名与注册/更新请求一致）
          content:
            application/json:
              schema:
                type: object
                required: [serviceId, sourceType, slug, displayName, credentialConfigured]
                properties:
                  serviceId: { type: string }
                  sourceType: { type: string, enum: [A2A_REMOTE, HIAGENT] }
                  slug: { type: string }
                  displayName: { type: string }
                  agentCardUrl: { type: string }
                  tags: { type: string }
                  baseUrl: { type: string }
                  description: { type: string }
                  skills: { type: array, items: { type: object } }
                  inputsSchema: { type: object }
                  connectionTest: { type: object }
                  credentialConfigured: { type: boolean }
        "400": { $ref: "#/components/responses/PlatformError" }
        "401": { $ref: "#/components/responses/PlatformError" }
        "403": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      responses:
        "200":
          description: 统一 Agent 目录（composite=Agent Team；remote=A2A_REMOTE/HIAGENT 注册，行带 sourceType）
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/PlatformError" }
    post:
      tags: [agents]
      operationId: createMaster
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMasterRequest" }
      responses:
        "200":
          description: 创建的 Agent Team（sourceType=COMPOSITE）或 HIAGENT 注册
          content:
            application/json:
              schema:
                type: object
        "400": { $ref: "#/components/responses/PlatformError" }
        "401": { $ref: "#/components/responses/PlatformError" }
        "409": { $ref: "#/components/responses/PlatformError" }
        "502": { $ref: "#/components/responses/PlatformError" }

  /api/v1/agents/{masterId}:
    get:
      tags: [agents]
      operationId: getMaster
      parameters:
        - $ref: "#/components/parameters/MasterId"
      responses:
        "200":
          description: Agent Team 详情（绑定/提示词/运行统计）
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/agents/{masterId}:test-run:
    post:
      tags: [agents]
      operationId: testRunMaster
      description: |
        管理台单点试运行（scope agent:manage）：对该 Agent Team 发起一次真实调用，
        走的是与 /a2a/{slug}/ 相同的 master_service.run_master，同样落
        run_record 与 invocation_event，区别只在少了 A2A 协议外壳且默认不套
        入站 framing。用于验证意图路由与答案质量，不是压测（压测见
        /api/v1/perf/tests）。
        响应中的 toolbox 是本次调用的工具箱快照，用于区分「工具没进工具箱」
        （权限/发布链问题）与「工具在箱子里但模型没选」（提示词/描述问题）。
      parameters:
        - $ref: "#/components/parameters/MasterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 8000
                  description: 发给 Agent Team 的用户文本
                contextId:
                  type: string
                  maxLength: 64
                  description: |
                    对话上下文。省略则每次新建（互不串扰）；传入上一次响应的
                    contextId 即为多轮追问（含澄清握手的补充输入）。
                asUser:
                  type: string
                  maxLength: 64
                  description: |
                    以该 cap-user-name 的身份解析可见服务；省略则用调用者本人。
                    A2A 工具受可见性约束，知识库工具不受（绑定即授权）。
                inboundFraming:
                  type: boolean
                  default: false
                  description: |
                    是否套用 A2A 入站「不可信远端」framing 前缀。默认 false
                    （管理台是内部调用）；置 true 可复现真实远端调用的模型行为。
      responses:
        "200":
          description: 运行结果 + 路由轨迹 + 工具箱快照
          content:
            application/json:
              schema:
                type: object
                required: [runId, status, output, routedServices, toolbox]
                properties:
                  runId: { type: string }
                  status:
                    type: string
                    description: SUCCEEDED / FAILED / LIMIT_REACHED / REJECTED / CANCELED
                  errorCode: { type: string, nullable: true }
                  errorDetail: { type: string, nullable: true }
                  output: { type: string }
                  inputRequired:
                    type: boolean
                    description: 模型判定信息不足并已追问（R3 澄清握手）
                  routedServices:
                    type: array
                    items: { type: string }
                  toolCalls:
                    type: array
                    description: 逐次工具调用轨迹（已脱敏截断）
                    items:
                      type: object
                      properties:
                        tool: { type: string }
                        state: { type: string }
                        output: { type: string }
                  elapsedMs: { type: integer }
                  promptVersionId: { type: string, nullable: true }
                  traceId: { type: string, nullable: true }
                  contextId: { type: string }
                  asUser: { type: string }
                  toolbox:
                    type: object
                    description: 本次调用模型可用的工具集合
                    properties:
                      a2a:
                        type: array
                        items:
                          type: object
                          properties:
                            toolName: { type: string }
                            toolDescription: { type: string }
                            serviceSlug: { type: string }
                            releaseId: { type: string }
                            agentVersion: { type: string }
                      kb:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            description: { type: string }
                      unavailable:
                        type: object
                        additionalProperties: { type: string }
                        description: 已绑定但解析失败的工具 → 原因码
        "400": { $ref: "#/components/responses/PlatformError" }
        "401": { $ref: "#/components/responses/PlatformError" }
        "403": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/agents/{masterId}:export-standalone:
    post:
      tags: [agents, standalone]
      operationId: exportStandalone
      description: |
        导出该 Agent Team 为独立部署包 tar.gz（standalone-deployment 01 §7，
        scope agent:manage）。三件套联合锁定：响应头 X-Deploy-Digest /
        X-Card-Digest / X-Snapshot-Hash / X-Image-Tag。一期边界 fail-closed：
        含 A2A 子服务绑定 → 409；KB 绑定未 READY → 409；card.json 不含
        api_key（部署方 env 注入）。
      parameters:
        - $ref: "#/components/parameters/MasterId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                imageTag:
                  type: string
                  description: 引擎镜像 tag（deploy_digest 分量，构建期烘焙）
                  default: eagent-standalone:latest
      responses:
        "200":
          description: |
            部署包 tar.gz（card.json + kb_snapshot/ + Dockerfile.standalone +
            deploy/standalone.yaml + .env.example + README.md）
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/PlatformError" }
        "403": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }
        "409": { $ref: "#/components/responses/PlatformError" }

  /api/v1/agents/{masterId}/standalone-exports:
    get:
      tags: [agents, standalone]
      operationId: listStandaloneExports
      description: 导出登记列表（产物与配置状态经 master/version/digest 关联可查）
      parameters:
        - $ref: "#/components/parameters/MasterId"
      responses:
        "200":
          description: 导出登记（eag_standalone_export）
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/PlatformError" }
        "403": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}/canary:
    post:
      tags: [governance]
      operationId: createCanary
      description: |
        DEV-11 开灰度：白名单用户恒走候选版，其余用户按 canary+工号 的
        稳定哈希比例分组（同用户不漂移）；基线自动取默认解析链版本。
        与流量策略互斥。阈值默认 max_error_rate=0.05 / min_samples=20。
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateReleaseId]
              properties:
                candidateReleaseId: { type: string }
                whitelist:
                  type: array
                  items: { type: string }
                ratio: { type: number, default: 0.1 }
                thresholds: { type: object }
      responses:
        "200": { description: 灰度已创建 }
        "400": { $ref: "#/components/responses/PlatformError" }
        "409": { $ref: "#/components/responses/PlatformError" }
    get:
      tags: [governance]
      operationId: getCanary
      description: 灰度状态 + 候选/基线双组指标（真实调用账本聚合，无则 NONE）
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200": { description: 灰度与指标 }
        "401": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}/canary:evaluate:
    post:
      tags: [governance]
      operationId: evaluateCanary
      description: |
        阈值守护：候选样本 ≥ min_samples 且错误率超 max_error_rate 时
        自动 ABORT（分组路由即刻失效）；达标返回 ELIGIBLE。
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200": { description: 守护判定 }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}/canary:promote:
    post:
      tags: [governance]
      operationId: promoteCanary
      description: 达标全量——比例改 1.0，全部流量走候选版（保持观察态）
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200": { description: 已全量 }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}/canary:abort:
    post:
      tags: [governance]
      operationId: abortCanary
      description: 人工紧急停止——分组路由即刻失效，恢复默认解析链
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200": { description: 已停止 }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/external-tools:
    post:
      tags: [external]
      operationId: createExternalTool
      description: |
        DEV-05 注册外部服务只读工具。kind=kb_query（外部知识库问答，
        统一 kb_search 语义+来源标注+不可信声明）/ rest（通用 REST，
        声明式参数）/ hiagent（预留实现位，待官方文档，注册即拒）。
        出站走 SSRF 守卫；headers AES-GCM 加密落库永不回显；工具随
        Agent Team 工具箱装配（master_id 匹配或全局）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, description, endpoint]
              properties:
                kind: { type: string, enum: [kb_query, rest, hiagent] }
                name: { type: string }
                description: { type: string }
                endpoint: { type: string }
                method: { type: string, default: POST }
                headers:
                  type: object
                  nullable: true
                bodyTemplate: { type: string, nullable: true }
                params:
                  type: array
                  nullable: true
                  items: { type: object }
                masterId: { type: string, nullable: true }
      responses:
        "201": { description: 已注册 }
        "400": { $ref: "#/components/responses/PlatformError" }
        "403": { $ref: "#/components/responses/PlatformError" }
    get:
      tags: [external]
      operationId: listExternalTools
      description: 外部工具列表（凭证列不出）
      responses:
        "200": { description: 工具列表 }

  /api/v1/external-tools/{toolId}:
    put:
      tags: [external]
      operationId: updateExternalTool
      description: |
        编辑外部工具（按需更新：只有请求里出现的字段才改）。name 与
        kind 不可改；headers 出现即整体替换（重新加密），缺省 = 保持
        原凭证（凭证永不回显，编辑表单不回填）。
      parameters:
        - name: toolId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                endpoint: { type: string }
                method: { type: string }
                headers:
                  type: object
                  nullable: true
                bodyTemplate: { type: string, nullable: true }
                params:
                  type: array
                  nullable: true
                  items: { type: object }
                masterId: { type: string, nullable: true }
      responses:
        "200": { description: 更新后的工具（凭证列不出） }
        "400": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }
    delete:
      tags: [external]
      operationId: deleteExternalTool
      parameters:
        - name: toolId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已删除 }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/external-tools/{toolId}:enable:
    post:
      tags: [external]
      operationId: enableExternalTool
      parameters:
        - name: toolId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已启用 }

  /api/v1/external-tools/{toolId}:disable:
    post:
      tags: [external]
      operationId: disableExternalTool
      parameters:
        - name: toolId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已停用 }

  /api/v1/efficiency/faqs:generate:
    post:
      tags: [efficiency]
      operationId: generateFaqs
      description: |
        DEV-17 从真实运行记录挖高频问答对生成候选 FAQ。Q/A 逐字取自
        SUCCEEDED 且走了 KB 工具的运行（redact 后落库，不生成改写）。
      parameters:
        - name: masterId
          in: query
          schema: { type: string, nullable: true }
      responses:
        "200":
          description: 挖掘结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusters: { type: integer }
                  created: { type: integer }
        "403": { $ref: "#/components/responses/PlatformError" }

  /api/v1/efficiency/faqs:
    get:
      tags: [efficiency]
      operationId: listFaqs
      description: 候选 FAQ 列表（按频次倒序）
      parameters:
        - name: status
          in: query
          schema: { type: string, nullable: true }
      responses:
        "200": { description: FAQ 列表 }

  /api/v1/efficiency/faqs/{faqId}:decide:
    post:
      tags: [efficiency]
      operationId: decideFaq
      description: |
        审批候选 FAQ。approve 且带 kbId 时合成 Markdown 源走 KB 入库
        规划（upload_source → planner），状态置 INGESTED。
      parameters:
        - name: faqId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                kbId: { type: string, nullable: true }
      responses:
        "200": { description: 审批结果 }
        "404": { $ref: "#/components/responses/PlatformError" }
        "409": { $ref: "#/components/responses/PlatformError" }

  /api/v1/efficiency/gaps:scan:
    post:
      tags: [efficiency]
      operationId: scanGaps
      description: 扫 KB 拒答（no_reliable_hit）聚类进知识缺口清单
      parameters:
        - name: masterId
          in: query
          schema: { type: string, nullable: true }
      responses:
        "200": { description: 扫描结果 }

  /api/v1/efficiency/gaps:
    get:
      tags: [efficiency]
      operationId: listGaps
      description: 知识缺口清单（按命中次数倒序）
      parameters:
        - name: status
          in: query
          schema: { type: string, default: OPEN }
      responses:
        "200": { description: 缺口列表 }

  /api/v1/efficiency/gaps/{gapId}:resolve:
    post:
      tags: [efficiency]
      operationId: resolveGap
      description: 知识补齐后人工关闭缺口
      parameters:
        - name: gapId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已关闭 }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/memory:
    get:
      tags: [memory]
      operationId: listMemory
      description: |
        DEV-01 分层记忆条目（scope=user/agent/shared，TTL 过期惰性过滤）。
        user 只允许查本人（cap-user-name 即 ownerId）；agent/shared 需
        agent:manage。user 与 agent 条目在 Agent Team 运行时注入提示词摘要段。
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [user, agent, shared] }
        - name: ownerId
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200": { description: 记忆列表 }
        "401": { $ref: "#/components/responses/PlatformError" }
        "403": { $ref: "#/components/responses/PlatformError" }
    post:
      tags: [memory]
      operationId: addMemory
      description: 新增记忆条目（脱敏后落库；user 只允许写本人）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, ownerId, content]
              properties:
                scope: { type: string, enum: [user, agent, shared] }
                ownerId: { type: string }
                content: { type: string }
                ttlSeconds: { type: integer, nullable: true }
                sourceTraceId: { type: string, nullable: true }
      responses:
        "201": { description: 已创建 }
        "400": { $ref: "#/components/responses/PlatformError" }
        "403": { $ref: "#/components/responses/PlatformError" }
    delete:
      tags: [memory]
      operationId: clearMemory
      description: 清除记忆条目（用户清自己 / agent:manage 清 agent 与 shared）
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string }
        - name: ownerId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已清除 }
        "403": { $ref: "#/components/responses/PlatformError" }

  /api/v1/observability/remote-logs:
    post:
      tags: [observability]
      operationId: ingestRemoteLogs
      description: |
        DEV-12 远程运行服务日志纳管。X-Internal-Token 与
        EAGENT_REMOTE_LOG_TOKEN 匹配才可写入（fail-closed，未配置令牌 =
        端点拒绝）；消息经模式化脱敏。MQ 消费者复用同一写入层。
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required: [message]
                    properties:
                      serviceId: { type: string, nullable: true }
                      level: { type: string, default: INFO }
                      traceId: { type: string, nullable: true }
                      runId: { type: string, nullable: true }
                      message: { type: string }
                      occurredAt: { type: string, nullable: true }
      responses:
        "200":
          description: 写入结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted: { type: integer }
                  skipped: { type: integer }
        "403": { $ref: "#/components/responses/PlatformError" }
    get:
      tags: [observability]
      operationId: queryRemoteLogs
      description: 检索已纳管的远程日志（按服务 / traceId）
      parameters:
        - name: serviceId
          in: query
          schema: { type: string }
        - name: traceId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200": { description: 日志列表 }
        "401": { $ref: "#/components/responses/PlatformError" }

  /api/v1/observability/alerts:
    get:
      tags: [observability]
      operationId: listAlerts
      description: |
        DEV-12 告警事件列表（FIRED 未关闭在前）。定时探测连续 N 次
        不可达触发 SERVICE_DOWN（静默窗口防重复），恢复触发
        SERVICE_RECOVERED；配置 EAGENT_ALERT_WEBHOOK_URL 时同步 webhook。
      parameters:
        - name: serviceId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200": { description: 告警列表 }
        "401": { $ref: "#/components/responses/PlatformError" }

  /api/v1/traffic-policies:
    get:
      tags: [governance]
      operationId: listTrafficPolicies
      description: DEV-10 生效中的多版本流量策略列表
      responses:
        "200":
          description: 策略列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      type: object
                      properties:
                        policy_id: { type: string }
                        service_id: { type: string }
                        entries:
                          type: array
                          items:
                            type: object
                            properties:
                              release_id: { type: string }
                              weight: { type: integer }
                        status: { type: string }
                        created_by: { type: string }
                        created_at: { type: string }
        "401": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}/traffic-policy:
    get:
      tags: [governance]
      operationId: getTrafficPolicy
      description: 查询服务的生效流量策略（无则 status=NONE）
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200": { description: 策略或 NONE }
        "401": { $ref: "#/components/responses/PlatformError" }
    put:
      tags: [governance]
      operationId: setTrafficPolicy
      description: |
        设置多版本流量比例（整体替换）。权重合计必须 100、至少两个
        PUBLISHED 版本且属于该服务；未 pin 绑定的调用按权重加权分流，
        选中版本不可用时自动让位其余版本。操作记审计事件。
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required: [releaseId, weight]
                    properties:
                      releaseId: { type: string }
                      weight: { type: integer }
      responses:
        "200": { description: 生效的策略 }
        "400": { $ref: "#/components/responses/PlatformError" }
        "401": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }
    delete:
      tags: [governance]
      operationId: deleteTrafficPolicy
      description: 一键回切——停用策略恢复默认解析链（审计留痕）
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200": { description: 已停用 }
        "401": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/services/{serviceId}/releases:
    get:
      tags: [releases]
      operationId: listReleases
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Release 列表（不可变历史）
