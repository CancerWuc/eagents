        "401": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }
        "409": { $ref: "#/components/responses/PlatformError" }

  /api/v1/workspaces/{workspaceId}/installations:
    get:
      tags: [installations]
      operationId: listInstallations
      parameters:
        - name: workspaceId
          in: path
          required: true
