        "200":
          description: 卸载后的安装记录
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/PlatformError" }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/instances/register:
