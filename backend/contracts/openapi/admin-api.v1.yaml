  # ------------------------------------------------------------------
  # 评测 / 标注 / 提示词优化闭环（能力④ Loop Engineer）
  # 闭环: 运行记录 →（挑样本）评测集 → 标注（可纠正期望值）→ 优化任务
  #      → 候选对比 → 人工发布 → 新的运行记录
  # ------------------------------------------------------------------
  /api/v1/datasets:
    get:
      tags: [eval]
      operationId: listDatasets
      parameters:
        - name: master_id
          in: query
          required: false
          schema: { type: string }
          description: 只看该 Agent Team 的评测集（不传则全量）
      responses:
        "200":
          description: 评测集列表
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/PlatformError" }
    post:
      tags: [eval]
      operationId: createDataset
      description: |
        从运行记录抽样建评测集。runIds 为空时取该 Agent Team 最近 50 条 SUCCEEDED。
        用例的 expected_service 取源运行的首个路由，可由标注纠正。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, masterId]
              properties:
                name: { type: string }
                masterId: { type: string }
                runIds:
                  type: array
                  items: { type: string }
                  description: 指定运行记录；空数组表示自动抽样
      responses:
        "200":
          description: 新建的评测集
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset_id: { type: string }
                  name: { type: string }
                  version_no: { type: integer }
                  cases: { type: integer }
        "401": { $ref: "#/components/responses/PlatformError" }

  /api/v1/datasets/{datasetId}:
    patch:
      tags: [eval]
      operationId: renameDataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: 改名后的评测集
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/PlatformError" }
    delete:
      tags: [eval]
      operationId: deleteDataset
      description: 删除评测集及其用例与标注；优化运行记录保留供追溯。
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/datasets/{datasetId}/cases:
    get:
      tags: [eval]
      operationId: listCases
      description: |
        用例 + 标注历史 + 源运行的 trace_id / status / error_code
        （带 trace_id 是为了让标注工作台能直接跳到调用链）。
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: 用例列表
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "404": { $ref: "#/components/responses/PlatformError" }
    post:
      tags: [eval]
      operationId: appendCases
      description: |
        把指定运行记录追加进已有评测集（运行监控/调用链上的「加入测试集」入口）。
        同一 run 只进一次，重复的计入 skipped。
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runIds]
              properties:
                runIds: { type: array, items: { type: string } }
      responses:
        "200":
          description: 追加结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }
                  skipped: { type: integer }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/cases/{caseId}/annotations:
    post:
      tags: [eval]
      operationId: annotateCase
      description: |
        人工标注。标注记录只追加，唯一会改写数据的是 correctedService——
        给出「正确答案该是哪个服务」时回写 eag_eval_case.expected_service（013）。
        判为错误却不给正确答案的用例，优化时会被排除在评分之外。
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intentCorrect: { type: boolean, nullable: true }
                subjectiveNote: { type: string, nullable: true }
                correctedService:
                  type: string
                  nullable: true
                  description: 正确答案应该是哪个工具/服务；回写期望值
                expectedText:
                  type: string
                  nullable: true
                  description: |
                    标准答案文本（014 / DEV-07）；回写 expected_text，
                    回放时参与 BLEU/ROUGE/F1 文本指标。经模式化脱敏后落库
      responses:
        "200":
          description: 标注结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  annotation_id: { type: string }
                  expected_service_updated: { type: boolean }
        "404": { $ref: "#/components/responses/PlatformError" }

  /api/v1/optimizations:
    get:
      tags: [eval]
      operationId: listOptimizations
      description: |
        优化任务列表。任务要跑几分钟，没有列表的话 optimization_id 只存在于
        发起它的那个页面内存里，刷新即丢。查询时顺带清扫超时僵尸任务
        （任务跑在进程内的 BackgroundTasks 里，进程重启会把它杀掉）。
      parameters:
        - name: master_id
          in: query
          schema: { type: string }
        - name: dataset_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: 任务列表（含 dataset_name / candidate_count / recommendation）
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/PlatformError" }
    post:
      tags: [eval]
      operationId: createOptimization
      description: |
        发起优化（后台执行，只产 DRAFT 候选，绝不自动发布）。
        前置校验：评测集非空；同一 Agent Team 不允许并发优化。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [masterId, datasetId]
              properties:
                masterId: { type: string }
                datasetId: { type: string }
      responses:
        "200":
          description: 任务已发起
          content:
            application/json:
              schema:
                type: object
                properties:
                  optimization_id: { type: string }
                  status: { type: string }
        "400": { $ref: "#/components/responses/PlatformError" }
        "409": { $ref: "#/components/responses/PlatformError" }

  /api/v1/optimizations/{optimizationId}:
    get:
      tags: [eval]
      operationId: getOptimization
      parameters:
        - $ref: "#/components/parameters/OptimizationId"
      responses:
        "200":
          description: 任务 + 候选（含 metric_json.annotation 标注影响统计）
          content:
            application/json:
              schema:
                type: object
                properties:
                  optimization: { type: object }
                  candidates: { type: array, items: { type: object } }
        "404": { $ref: "#/components/responses/PlatformError" }


  /api/v1/optimizations/{optimizationId}/candidates/{candidateId}/approve:
    post:
      tags: [eval]
      operationId: approveCandidate
      description: |
        人工复核通过 → 发布候选。绝不自动发布（D7），本接口即人工确认。

        候选是「提示词 + ReAct 参数」两件套（L3）：优化在 max_iters 小网格上搜过
        最优值，指标是按那个轮数测出来的。因此发布时**连同 react_config 一起落**，
        否则线上跑的是"新提示词 + 旧轮数"，报告里的准确率在线上不可复现。
        候选没带合法 ReAct 参数时 react_config 返回 null，只发布提示词。

        仅 PROPOSE 且已生成 DRAFT 版本的候选可发布，否则 409。
      parameters:
        - $ref: "#/components/parameters/OptimizationId"
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: 已发布
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved: { type: boolean }
                  candidate_id: { type: string }
                  published_prompt_version_id: { type: string }
                  hot_update: { type: boolean }
                  react_config:
                    type: object
                    nullable: true
                    description: 本次顺带落的 ReAct 参数；null = 未改动
                    properties:
                      max_iters: { type: integer }
                      changed: { type: boolean }
                      previous: { type: integer, nullable: true }
        "404": { $ref: "#/components/responses/PlatformError" }
        "409": { $ref: "#/components/responses/PlatformError" }

  /api/v1/optimizations/{optimizationId}/candidates/{candidateId}/reject:
    post:
      tags: [eval]
      operationId: rejectCandidate
      description: 人工驳回候选（幂等）——标记 REJECTED，不触碰提示词版本。
      parameters:
        - $ref: "#/components/parameters/OptimizationId"
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: 已驳回
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejected: { type: boolean }
                  candidate_id: { type: string }
        "404": { $ref: "#/components/responses/PlatformError" }

components:
  parameters:
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema: { type: string }
    OptimizationId:
      name: optimizationId
      in: path
      required: true
      schema: { type: string }
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string }
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string }
    GatewayProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: integer }
      description: 网关环境 id（eag_gateway_profile.id）
    PerfDatasetId:
      name: datasetId
      in: path
      required: true
      schema: { type: string }
    PerfTestId:
      name: testId
      in: path
      required: true
      schema: { type: string }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string }
    MasterId:
      name: masterId
      in: path
      required: true
      schema: { type: string }

  securitySchemes:
    capUser:
      type: apiKey
      in: header
      name: cap-user-name
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token

  responses:
    PlatformError:
      description: 平台统一错误（platform-error.v1 契约）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlatformError" }

  schemas:
    PlatformError:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{1,63}$"
        message:
          type: string
          maxLength: 512
        traceId:
          type: [string, "null"]
        details:
          type: array
          items:
            type: object
            required: [field, issue]
            properties:
              field: { type: string }
              issue: { type: string }

    RegisterServiceRequest:
      type: object
      required: [slug, displayName, agentCardUrl]
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 64
        displayName: { type: string }
        agentCardUrl:
          type: string
          pattern: "^https?://"
        authSecretRef:
          # intranet-a2a-stream-adapter: 服务级出站凭证 headers JSON
          # （如 {"apikey": "..."}），AES-GCM 加密落库，出站调用注入；
          # 响应不回显（只回 outbound_credential_configured 布尔）。
          type: [object, "null"]
          additionalProperties: { type: string }
        tags:
          type: [string, "null"]

    UpdateServiceCredentialsRequest:
      type: object
      description: 更新服务级出站凭证 headers；headers=null 表示清除。
      properties:
        headers:
          type: [object, "null"]
          additionalProperties: { type: string }

    ProbeServiceRequest:
      type: object
      required: [agentCardUrl]
      properties:
        agentCardUrl:
          type: string
          pattern: "^https?://"

    ProbeServiceResult:
      type: object
      required: [baseUrl, card, compatibility, compatibilityReason]
      properties:
        baseUrl: { type: string }
        compatibility: { type: string, enum: [VERIFYING, COMPATIBLE, INCOMPATIBLE] }
        compatibilityReason: { type: string }
        card:
          type: object
          required: [name, description, url, version, protocolVersion, capabilities, skills]
          properties:
            name: { type: string }
            description: { type: string }
            url: { type: string }
            version: { type: string }
            protocolVersion: { type: string }
            capabilities: { type: object }
            skills:
              type: array
              items:
                type: object
                properties:
                  id: { type: [string, "null"] }
                  name: { type: string }
                  description: { type: string }
                  tags: { type: array, items: { type: string } }

    CreateMasterRequest:
      type: object
      required: [slug, displayName]
      description: 统一注册入口。sourceType=COMPOSITE（缺省）建 Agent Team；HIAGENT 注册 HIA agent 为单 Agent A2A 服务（注册即连通性测试，本地契约错误返回 400，远端失败返回 502，均不落库；成功即挂载 /a2a/{slug}/）
      properties:
        slug: { type: string }
        displayName: { type: string }
        description: { type: [string, "null"] }
        maxIters:
          type: integer
          default: 8
        sourceType:
          type: string
          enum: [COMPOSITE, HIAGENT]
          default: COMPOSITE
        baseUrl:
          type: [string, "null"]
          description: HIAGENT 专属——实例级服务地址；空 = 全局 HIAGENT_URL 兜底链
        appKey:
          type: [string, "null"]
          description: HIAGENT 专属——实例级 AppKey（AES-GCM 加密落库，永不回显）；空 = 全局 HIAGENT_API_KEY 兜底
        skills:
          type: array
          nullable: true
          description: HIAGENT 专属——生成式 Agent Card 的 skills 素材
          items:
            type: object
            additionalProperties: true
        inputsSchema:
          type: [object, "null"]
          description: HIAGENT 专属——业务 Inputs 的 JSON Schema；object 节点必须设 additionalProperties=false
          additionalProperties: true
        connectionTest:
          type: [object, "null"]
          description: HIAGENT 专属——注册真实探测的问题与业务 Inputs；inputs 必须满足 inputsSchema
          required: [query, inputs]
          additionalProperties: false
          properties:
            query: { type: string, minLength: 1 }
            inputs:
              type: object
              additionalProperties: true

    ServiceRegistration:
      type: object
      description: 服务注册记录（eag_a2a_service_registration 行）
      properties:
        sourceType:
          type: string
          enum: [A2A_REMOTE, HIAGENT]
          description: 来源（HIAGENT = HIA agent，Card 由平台生成）
        service_id: { type: string }
        slug: { type: string }
        display_name: { type: string }
        agent_card_url: { type: string }
        auth_secret_ref:
          # 响应不再回显（intranet-a2a-stream-adapter: 密文不出 API 面），
          # 保留字段位兼容旧客户端读取 null。
          type: ["null"]
        outbound_credential_configured: { type: boolean }
        tags:
          type: [string, "null"]
        enabled: { type: integer }
        compatibility: { type: string }
        current_revision_id:
          type: [string, "null"]
        created_at: { type: string }
        updated_at: { type: string }

    AgentRelease:
      type: object
      description: 不可变发布版本（eag_agent_release 行; 契约 agent-release.v1）
      properties:
        release_id: { type: string }
        service_id: { type: string }
        agent_version: { type: string }
        card_revision_id: { type: string }
        card_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        endpoint: { type: string }
        state:
          type: string
          enum: [DRAFT, PUBLISHED, SUSPENDED, REVOKED]
        created_by: { type: string }
        created_at: { type: string }
        published_at:
          type: [string, "null"]
        suspended_at:
          type: [string, "null"]
        revoked_at:
          type: [string, "null"]

    Instance:
      type: object
      description: 实例快照（eag_agent_instance 行; P1-2）
      properties:
        instanceId: { type: string }
        serviceId: { type: string }
        instanceName: { type: string }
        endpoint: { type: string }
        state:
          type: string
          enum: [UNKNOWN, READY, DRAINING, UNAVAILABLE]
        ready: { type: boolean }
        serving: { type: boolean }
        terminating: { type: boolean }
        leaseExpiresAt:
          type: [string, "null"]
        lastHeartbeatAt:
          type: [string, "null"]
        metadata: { type: object }

    PerfDataset:
      type: object
      description: 性能测试数据集（eag_perf_dataset 行）
      properties:
        perf_dataset_id: { type: string }
        master_id: { type: string }
        name: { type: string }
        dataset_type:
          type: string
          enum: [PRESSURE, SIMULATION]
        status: { type: string }
        case_count: { type: integer }
        created_by: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    CreatePerfDatasetRequest:
      type: object
      required: [masterId, name, datasetType]
      properties:
        masterId: { type: string }
        name: { type: string, maxLength: 128 }
        datasetType:
          type: string
          enum: [PRESSURE, SIMULATION]

    CreatePerfTestRequest:
      type: object
      required: [masterId, datasetId, targetType, targetId, testType]
      properties:
        masterId: { type: string }
        datasetId: { type: string }
        targetType:
          type: string
          enum: [MASTER, SERVICE]
        targetId: { type: string }
        testType:
          type: string
          enum: [PRESSURE, SIMULATION]
        pressure:
          type: object
          description: 压力测试配置（testType=PRESSURE 必填）
          properties:
            concurrency: { type: integer, default: 5, maximum: 500 }
            totalRequests: { type: integer, default: 0 }
            durationSec: { type: number, default: 0 }
            rampUpSec: { type: number, default: 0 }
            timeoutMs: { type: integer, default: 60000 }
            capUser: { type: string }
            caseOrder:
              type: string
              enum: [ROUND_ROBIN, RANDOM]
              default: ROUND_ROBIN
            headers:
              type: object
              additionalProperties: { type: string }
        simulation:
          type: object
          description: 仿真测试配置（testType=SIMULATION 必填）
          properties:
            timeoutMs: { type: integer, default: 60000 }
            capUser: { type: string }
            maxConcurrency: { type: integer, default: 0, description: 0 = 不限 }
            headers:
              type: object
              additionalProperties: { type: string }

    # ===== Higress 网关配置控制面（higress-mcp-gateway 01 §5.2，T16） =====
    GatewayProfile:
      type: object
      description: 网关环境（形态 A 跨 ns / 形态 B 同 ns 共用同一模型）
      required: [id, name, higressNs]
      properties:
        id: { type: integer }
        name: { type: string }
        higressNs: { type: string }
        kubeContext: { type: string }
        higressVersion: { type: [string, "null"] }
        enabled: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    CreateGatewayProfileRequest:
      type: object
      required: [name, higressNs]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        higressNs: { type: string, minLength: 1, maxLength: 64 }
        kubeContext: { type: string, maxLength: 128, default: "" }
        higressVersion: { type: [string, "null"], maxLength: 16 }
    UpdateGatewayProfileRequest:
      type: object
      properties:
        higressNs: { type: string, minLength: 1, maxLength: 64 }
        kubeContext: { type: string, maxLength: 128 }
        higressVersion: { type: [string, "null"], maxLength: 16 }
        enabled: { type: boolean }
    GatewayProviderConfig:
      type: object
      description: ai-proxy provider（02 基准 §5：id=llm-<slug> 由服务名推导）
      required: [type, apiUrl]
      properties:
        type: { type: string, description: "provider 类型（如 deepseek/openai/qwen）" }
        protocol: { type: string, default: openai }
        apiUrl: { type: string }
        apiTokens: { type: array, items: { type: string } }
    GatewayRouteSpec:
      type: object
      description: 一键注册时的路由子对象（四步写序列第 4 步）
      properties:
        routeName: { type: [string, "null"], description: 缺省 route-<slug> }
        matchType: { type: string, enum: [PRE, EXACT, REGEX], default: PRE }
        matchValue: { type: string, default: "/" }
        weight: { type: integer, default: 100 }
        authEnabled: { type: boolean, default: true }
        retryEnabled: { type: boolean, default: true }
        retryAttempts: { type: integer, default: 3 }
        consumerName: { type: [string, "null"], description: 缺省 consumer-<slug> }
    RegisterGatewayMcpServiceRequest:
      type: object
      required: [name, domain]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        domain: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, default: 443 }
        protocol: { type: string, default: https }
        registryType: { type: string, enum: [dns, static, failover], default: dns }
        provider: { $ref: "#/components/schemas/GatewayProviderConfig" }
        route: { $ref: "#/components/schemas/GatewayRouteSpec" }
    CreateGatewayRouteRequest:
      type: object
      required: [name, matchValue, upstreamName]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        matchType: { type: string, enum: [PRE, EXACT, REGEX], default: PRE }
        matchValue: { type: string, minLength: 1, maxLength: 512 }
        upstreamName: { type: string, description: MCP 服务名（自动解析 registry/provider 引用链） }
        weight: { type: integer, default: 100 }
        authEnabled: { type: boolean, default: true }
        authType: { type: string, default: key-auth }
        retryEnabled: { type: boolean, default: true }
        retryAttempts: { type: integer, default: 3 }
        consumers: { type: array, items: { type: string }, description: 绑定的 consumer 名单 }
    UpdateGatewayRouteRequest:
      type: object
      description: 全部字段可选；consumers 传入即整体替换绑定集
      properties:
        matchType: { type: string, enum: [PRE, EXACT, REGEX] }
        matchValue: { type: string, minLength: 1, maxLength: 512 }
        upstreamName: { type: string }
        weight: { type: integer }
        authEnabled: { type: boolean }
        authType: { type: string }
        retryEnabled: { type: boolean }
        retryAttempts: { type: integer }
        consumers: { type: array, items: { type: string } }
    CreateGatewayConsumerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        credential:
          type: [string, "null"]
          description: 缺省自动生成（随机 32B base64url）；显式传入用于导入
        routes: { type: array, items: { type: string } }
    GatewayConfigExport:
      type: object
      description: 网关配置导出/导入载体（exportVersion=1；consumer 密钥永不导出）
      required: [kind]
      properties:
        exportVersion: { type: integer }
        kind: { type: string, enum: [eagent-gateway-config] }
        source: { type: object }
        secretsIncluded: { type: boolean }
        mcpServices:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              domain: { type: string }
              port: { type: integer }
              protocol: { type: string }
              registryType: { type: string }
              providerConfig: { $ref: "#/components/schemas/GatewayProviderConfig" }
        routes:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              matchType: { type: string }
              matchValue: { type: string }
              upstreamName: { type: string }
              weight: { type: integer }
              authEnabled: { type: boolean }
              retryEnabled: { type: boolean }
              retryAttempts: { type: integer }
        consumers:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              routes: { type: array, items: { type: string } }
