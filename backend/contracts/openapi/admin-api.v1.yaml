        "404": { $ref: "#/components/responses/PlatformError" }
        "409": { $ref: "#/components/responses/PlatformError" }

  /api/v1/releases/{releaseId}:suspend:
    post:
      tags: [releases]
      operationId: suspendRelease
      parameters:
