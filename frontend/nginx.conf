# eAgent 管理台 nginx：静态资源 + API/A2A 反向代理到 manager 后端
# 开发态由 vite dev server 的 proxy 承担同样的角色（vite.config.js）
server {
    listen 80;
    server_name _;

    # 静态资源（Vue SPA，history 路由回落到 index.html）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 管理面 API → manager 后端（透传身份与令牌头）
    # 反代目标经 nginx 镜像的 templates 机制在容器启动时 envsubst 注入
    # （仅替换容器已定义的环境变量，$host/$uri 等 nginx 运行时变量不受影响）
    location /api/ {
        proxy_pass http://${EAGENT_BACKEND_UPSTREAM};
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        # 评测/优化/KB 编译等长耗时操作对齐后端处理能力（默认 60s 会掐断
        # 总控 ReAct 多轮真实 LLM 调用，见 wiki deployment/01 §5）
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # A2A 端点 → manager 后端（含 /.well-known Card 发现）
    location /a2a/ {
        proxy_pass http://${EAGENT_BACKEND_UPSTREAM};
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        # 总控 message/send 为同步调用：ReAct 多轮 + wall-clock 预算下
        # 单次请求可能远超 nginx 默认 60s，超时会被反代掐断成 504
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
